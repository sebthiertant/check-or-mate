[project]
name = "ingestion"
version = "0.1.0"
description = "Chess.com game ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "python-chess>=1.999",
  "pydantic>=2.7.0",
  "pyyaml>=6.0",
]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
