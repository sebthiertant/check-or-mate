[project]
name = "analysis"
version = "0.1.0"
description = "Chess game heuristic scoring pipeline"
requires-python = ">=3.12"
dependencies = [
  "python-chess>=1.999",
  "pydantic>=2.7.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
