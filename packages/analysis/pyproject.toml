[project]
name = "analysis"
version = "0.1.0"
description = "Chess game scoring and Stockfish analysis"
requires-python = ">=3.12"
dependencies = [
  "python-chess>=1.999",
  "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]
