scoring:
  # Weights for the overall score.
  # eval_swing and brilliancy require Stockfish (M5); without an Evaluator they
  # default to 0 for every game and normalise to 50 (neutral).
  weights:
    sacrifice: 0.20
    eval_swing: 0.15
    brilliancy: 0.15
    time_pressure: 0.15
    endgame_quality: 0.15
    rating_upset: 0.10
    opening_rarity: 0.10

  thresholds:
    time_pressure_window_s: 10   # moves with < 10s on the clock count as pressure
    endgame_piece_count: 6       # positions with ≤ 6 pieces total = endgame
    rating_upset_max_delta: 300  # 300 Elo upset → raw score capped at this value
