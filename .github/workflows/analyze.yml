name: Stockfish analysis

on:
  workflow_dispatch:
  workflow_call:   # called by ingest.yml after a successful ingestion

concurrency:
  group: analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    name: Score games with Stockfish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          echo "STOCKFISH_PATH=$(command -v stockfish)" >> "$GITHUB_ENV"

      - run: uv sync --package analysis --frozen

      - name: Score games
        run: |
          uv run analysis score \
            --engine-path "$STOCKFISH_PATH" \
            --output data/scores.json

      - name: Commit scored results
        run: |
          git config user.name  "check-or-mate bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet || git commit -m "chore(data): analysis scores $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Analysis failed — ${new Date().toISOString().slice(0,10)}`,
              labels: ['bug'],
              body: `Stockfish analysis workflow failed. [See run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            })
