name: Stockfish analysis

on:
  workflow_dispatch:
  workflow_call:   # called by ingest.yml after a successful ingestion

concurrency:
  group: analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    name: Score un-analyzed games
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]   # 4 parallel runners split the work
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish 16
        run: sudo apt-get install -y stockfish

      - run: uv sync --package analysis

      - name: Run analysis (shard ${{ matrix.shard }} of 4)
        run: |
          uv run python -m analysis score \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4

      - name: Commit scored games
        run: |
          git config user.name  "check-or-mate bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/games.db
          git diff --staged --quiet || git commit -m "chore(data): analysis shard ${{ matrix.shard }} $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Analysis failed — shard ${{ matrix.shard }} — ${new Date().toISOString().slice(0,10)}`,
              labels: ['bug'],
              body: `Stockfish analysis failed on shard ${{ matrix.shard }}. [See run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            })
