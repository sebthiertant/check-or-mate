name: Stockfish analysis

on:
  workflow_dispatch:
  workflow_call:   # called by ingest.yml after a successful ingestion

concurrency:
  group: analyze
  cancel-in-progress: false

permissions:
  contents: write   # commit scores.json
  issues: write     # open issue on failure

jobs:
  analyze:
    name: Score games with Stockfish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"

      # Restaure games.db depuis le dernier cache disponible (sauvé par ingest.yml).
      # Si aucun cache n'existe, l'étape "Score games" s'arrêtera proprement
      # avec le message "No games found".
      - name: Restore games.db from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: data/games.db
          key: games-db-${{ github.run_id }}
          restore-keys: |
            games-db-

      # Le cache des évaluations Stockfish (FEN → centipawns) évite de réévaluer
      # les positions d'ouverture communes à chaque run.
      - name: Restore eval cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: data/eval_cache
          key: eval-cache-${{ github.run_id }}
          restore-keys: |
            eval-cache-

      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          echo "STOCKFISH_PATH=$(command -v stockfish)" >> "$GITHUB_ENV"

      - run: uv sync --package analysis --frozen

      - name: Score games
        run: |
          uv run analysis score \
            --engine-path "$STOCKFISH_PATH" \
            --since "$(date -u -d '7 days ago' +%Y-%m-%d)" \
            --top-n 100 \
            --output apps/web/data/scores.json

      - name: Save eval cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: data/eval_cache
          key: eval-cache-${{ github.run_id }}

      - name: Commit scored results
        run: |
          git config user.name  "check-or-mate bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps/web/data/scores.json
          git diff --staged --quiet || git commit -m "chore(data): analysis scores $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Analysis failed — ${new Date().toISOString().slice(0,10)}`,
              labels: ['bug'],
              body: `Stockfish analysis workflow failed. [See run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            })
