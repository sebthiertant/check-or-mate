name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python ────────────────────────────────────────────────────────────────
  python-lint:
    name: Python — ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check packages/
      - run: uv run ruff format --check packages/
      - run: uv run mypy packages/

  python-test:
    name: Python — pytest
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --frozen
      - run: uv run pytest packages/ --tb=short -q --ignore=packages/analysis

  # ── TypeScript ────────────────────────────────────────────────────────────
  ts-lint:
    name: TypeScript — ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check

  ts-typecheck:
    name: TypeScript — tsc
    runs-on: ubuntu-latest
    needs: ts-lint
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck

  ts-build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: ts-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
