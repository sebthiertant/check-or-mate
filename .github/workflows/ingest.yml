name: Nightly ingestion

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC every day
  workflow_dispatch:
    inputs:
      player:
        description: "Chess.com username to sync (leave blank for full watchlist)"
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false   # never abort an in-flight ingestion

permissions:
  contents: write   # commit watchlist.yml
  issues: write     # open issue on failure

jobs:
  ingest:
    name: Fetch game archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --package ingestion --frozen

      # games.db est trop grand pour git (>100 MB) — on le stocke dans le cache CI.
      # restore-keys permet de récupérer le dernier cache disponible si aucun
      # cache exact pour ce run n'existe encore.
      - name: Restore games.db from cache
        uses: actions/cache/restore@v4
        with:
          path: data/games.db
          key: games-db-${{ github.run_id }}
          restore-keys: |
            games-db-

      - name: Populate watchlist from leaderboard
        if: ${{ !inputs.player }}
        run: uv run ingest populate --watchlist data/watchlist.yml

      - name: Sync games
        run: |
          if [ -n "${{ inputs.player }}" ]; then
            uv run ingest sync --player "${{ inputs.player }}" --db data/games.db
          else
            uv run ingest sync-all --watchlist data/watchlist.yml --db data/games.db
          fi

      - name: Save games.db to cache
        uses: actions/cache/save@v4
        with:
          path: data/games.db
          key: games-db-${{ github.run_id }}

      - name: Commit updated watchlist
        run: |
          git config user.name  "check-or-mate bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/watchlist.yml
          git diff --staged --quiet || git commit -m "chore(data): nightly ingestion $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger analysis
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'analyze.yml',
              ref: 'main'
            })

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Ingestion failed — ${new Date().toISOString().slice(0,10)}`,
              labels: ['bug'],
              body: `The nightly ingestion workflow failed. [See run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            })
