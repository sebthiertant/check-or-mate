[project]
name = "check-or-mate"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/ingestion", "packages/analysis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
]
